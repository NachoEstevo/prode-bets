<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prode Bets</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>Prode Bets</h1>
        <p>Prediction drops and friends context for kickoff.</p>
      </div>
    </header>

    <section id="match-card" class="card" aria-live="polite">
      <p>Loading match...</p>
    </section>

    <section class="card controls">
      <h2>Overlay controls</h2>
      <p id="state-label" class="muted">Checking overlay state...</p>
      <div class="control-row">
        <button type="button" data-action="show-overlay">Show overlay</button>
        <button type="button" data-action="hide-overlay">Hide overlay</button>
      </div>
    </section>

    <section class="card">
      <h2>Polymarket lane</h2>
      <p class="muted">Read-only demo opens markets externally. Eligibility and order preview belong in a later integration pass.</p>
      <a id="market-link" href="https://polymarket.com" target="_blank" rel="noreferrer">Open Polymarket</a>
    </section>
  </main>
  <script type="module" src="./popup.js"></script>
</body>
</html>
